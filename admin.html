<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kelola Produk Hay Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen pb-10">

    <main class="max-w-md mx-auto px-4 py-6 relative z-20 space-y-4">
        
        <!-- HEADER ADMIN -->
        <div class="hayday-section-card text-center p-3">
            <h1 class="font-black text-[#5c4a38] text-sm uppercase">Admin Panel (Tanpa SQL)</h1>
            <p class="text-[10px] text-[#725e42] font-bold">Tambah & Kelola Produk / Mesin</p>
            <a href="index.html" class="inline-block mt-2 text-[10px] text-white font-black bg-[#ff9800] px-3 py-1.5 rounded-xl uppercase border-b-2 border-[#d87200]">
                <i class="fa-solid fa-eye mr-1"></i> Lihat Halaman Depan
            </a>
        </div>

        <!-- FORM GANTI GAMBAR TOKO -->
        <section class="hayday-section-card space-y-2">
            <h2 class="font-black text-[#5c4a38] text-xs uppercase border-b border-[#ded7b8] pb-1">Ganti Banner Toko</h2>
            <form id="form-banner" class="space-y-2 text-[11px]">
                <div>
                    <label class="block font-bold text-[#725e42]">Upload Foto Banner</label>
                    <input type="file" id="banner-file" accept="image/*" required 
                        class="w-full bg-white border-2 border-[#ded7b8] p-1.5 rounded-xl font-bold text-[#5c4a38] text-[10px] focus:outline-none focus:border-[#ff9800]">
                </div>
                <button type="submit" class="w-full bg-[#ff9800] text-white font-black py-2 rounded-xl uppercase border-b-2 border-[#d87200] active:translate-y-0.5">
                    <i class="fa-solid fa-image mr-1"></i> Simpan Banner Toko
                </button>
            </form>
        </section>

        <!-- FORM INPUT PRODUK -->
        <section class="hayday-section-card space-y-3">
            <h2 class="font-black text-[#5c4a38] text-xs uppercase border-b border-[#ded7b8] pb-1">Tambah Data Baru</h2>
            
            <form id="form-tambah" class="space-y-2 text-[11px]">
                <div>
                    <label class="block font-bold text-[#725e42]">Nama Item</label>
                    <input type="text" id="nama" placeholder="Contoh: Gula Merah / Mesin Roti" required class="w-full bg-white border-2 border-[#ded7b8] p-2 rounded-xl font-bold text-[#5c4a38] focus:outline-none focus:border-[#ff9800]">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-[#725e42]">Kategori</label>
                        <input type="text" id="kategori" placeholder="Contoh: Gula, Roti" required class="w-full bg-white border-2 border-[#ded7b8] p-2 rounded-xl font-bold text-[#5c4a38] focus:outline-none focus:border-[#ff9800]">
                    </div>
                    
                    <!-- JENIS: DENGAN TOMBOL PILIHAN LANGSUNG (TANPA POP-UP BROWSER) -->
                    <div>
                        <label class="block font-bold text-[#725e42] mb-1">Jenis</label>
                        <div class="flex gap-1">
                            <label class="flex-1 bg-white border-2 border-[#ded7b8] p-1.5 rounded-xl flex items-center justify-center gap-1 cursor-pointer font-bold text-[10px] text-[#5c4a38]">
                                <input type="radio" name="jenis_radio" value="food" checked onchange="document.getElementById('jenis').value=this.value"> Food
                            </label>
                            <label class="flex-1 bg-white border-2 border-[#ded7b8] p-1.5 rounded-xl flex items-center justify-center gap-1 cursor-pointer font-bold text-[10px] text-[#5c4a38]">
                                <input type="radio" name="jenis_radio" value="machine" onchange="document.getElementById('jenis').value=this.value"> Machine
                            </label>
                        </div>
                        <input type="hidden" id="jenis" value="food">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-[#725e42]">Level Minimal</label>
                        <input type="number" id="level" placeholder="1" min="1" required class="w-full bg-white border-2 border-[#ded7b8] p-2 rounded-xl font-bold text-[#5c4a38] focus:outline-none focus:border-[#ff9800]">
                    </div>
                    <div>
                        <label class="block font-bold text-[#725e42]">Harga (Rp)</label>
                        <input type="number" id="harga" placeholder="500" min="0" required class="w-full bg-white border-2 border-[#ded7b8] p-2 rounded-xl font-bold text-[#5c4a38] focus:outline-none focus:border-[#ff9800]">
                    </div>
                </div>

                <!-- UPLOAD FOTO PRODUK DARI GALERI -->
                <div>
                    <label class="block font-bold text-[#725e42]">Upload Foto Produk</label>
                    <input type="file" id="gambar-file" accept="image/*" required 
                        class="w-full bg-white border-2 border-[#ded7b8] p-1.5 rounded-xl font-bold text-[#5c4a38] text-[10px] focus:outline-none focus:border-[#ff9800]">
                </div>

                <button type="submit" class="w-full bg-[#6bb962] text-white font-black py-2.5 rounded-xl uppercase border-b-4 border-[#4a8d42] active:translate-y-0.5 mt-2">
                    <i class="fa-solid fa-plus mr-1"></i> Simpan Item
                </button>
            </form>
        </section>

        <!-- DAFTAR ITEM TERSEMBUNYI / TERDAPAT -->
        <section class="hayday-section-card space-y-3">
            <div class="flex justify-between items-center border-b border-[#ded7b8] pb-1">
                <h2 class="font-black text-[#5c4a38] text-xs uppercase">Daftar Tersimpan (<span id="total-item">0</span>)</h2>
                <button type="button" onclick="hapusSemuaData()" class="text-[9px] bg-red-500 text-white font-bold px-2 py-1 rounded-lg">Reset Semua Data</button>
            </div>

            <div id="admin-list-produk" class="space-y-2 max-h-80 overflow-y-auto pr-1">
                <!-- Daftar item akan diproduksi oleh JS -->
            </div>
        </section>

    </main>

    <script src="js/admin.js"></script>
</body>
</html>
