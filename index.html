<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hay Day Food List</title>
    
    <!-- Tailwind CSS (framework UI) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS milik sendiri -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen">

    <!-- Animasi Daun Gugur -->
    <div class="leaf-container" id="leaf-container"></div>

    <!-- Container Utama Tampilan HP -->
    <main class="max-w-md mx-auto px-4 py-6 relative z-20">
        
        <!-- Papan / Board Utama Hay Day -->
        <section class="hayday-section-card">
            
            <!-- Header Atas -->
            <div class="flex justify-between items-center mb-4 px-1">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-6 bg-[#6bb962] rounded-full shadow-sm"></span>
                    <h1 class="font-black text-[#5c4a38] text-xs uppercase tracking-wider">Hay Day Food List</h1>
                </div>
                <span id="total-info" class="text-[#725e42] font-black text-[10px] uppercase bg-[#ece5c8] px-2.5 py-1 rounded-full border border-[#ded7b8]">
                    0 food
                </span>
            </div>

            <!-- Tombol Filter Kategori (Menu Scroll Menyamping) -->
            <div class="overflow-x-auto flex gap-2 no-scrollbar mb-4 py-1" id="kategori-wrapper">
                <button type="button" class="btn-kategori active-kat flex-none uppercase">
                    Semua
                </button>
            </div>

            <!-- Grid Daftar Produk -->
            <div class="grid grid-cols-2 gap-3" id="produk-wrapper">
                <!-- Tampilan Loading Awal -->
                <div class="col-span-2 text-center py-10 bg-white rounded-2xl border border-[#ded7b8]">
                    <i class="fa-solid fa-spinner animate-spin text-[#8c785c] text-2xl mb-2 block"></i>
                    <p class="text-xs font-black text-[#725e42] uppercase">Memuat Produk...</p>
                </div>
            </div>

            <!-- Tombol Pesan WA di Bawah -->
            <div class="mt-5 pt-4 border-t border-[#ded7b8]">
                <a href="#" id="btn-wa" class="w-full bg-[#ff9800] text-white font-black text-xs py-3 rounded-2xl uppercase border-b-4 border-[#d87200] active:translate-y-0.5 transition-all flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-brands fa-whatsapp text-base"></i> Beli via WA
                </a>
            </div>

        </section>

    </main>

    <!-- JS milik sendiri -->
    <script src="js/main.js"></script>
</body>
</html>
