<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hay Day Food List</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen">

    <!-- Animasi Daun Gugur -->
    <div class="leaf-container" id="leaf-container"></div>

    <!-- Container Utama Layar HP -->
    <main class="max-w-md mx-auto px-4 py-6 relative z-20 space-y-4">

        <!-- 1. GAMBAR TOKO (HEADER BANNER) -->
        <div class="hayday-section-card p-3 text-center overflow-hidden">
            <div class="relative w-full h-32 rounded-2xl overflow-hidden border-2 border-[#ded7b8] mb-2 bg-[#e2d9b7] flex items-center justify-center">
                <img id="gambar-toko" 
                     src="assets/banner.jpg" 
                     onerror="this.onerror=null; this.src='https://placehold.co/400x150/ded7b8/5c4a38?text=Hay+Day+Store';" 
                     alt="Gambar Toko" 
                     class="w-full h-full object-cover">
            </div>
            <h1 class="font-black text-[#5c4a38] text-sm uppercase tracking-wider">Hay Day Food List</h1>
            <p class="text-[10px] text-[#725e42] font-semibold">Daftar Produk & Mesin Lengkap</p>
        </div>

        <!-- BOARD UTAMA (KONTEN & FILTER) -->
        <section class="hayday-section-card space-y-4">

            <!-- 2. SECTION PENCARIAN -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Cari produk atau mesin..." 
                    class="w-full bg-white border-2 border-[#ded7b8] rounded-xl py-2 pl-9 pr-3 text-xs text-[#5c4a38] font-bold placeholder-[#a89a85] focus:outline-none focus:border-[#ff9800] shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-[#a89a85]"></i>
            </div>

            <!-- 3. SECTION KATEGORI -->
            <div>
                <label class="block text-[10px] font-black text-[#725e42] uppercase mb-1.5 px-1">Kategori Produk</label>
                <div class="overflow-x-auto flex gap-2 no-scrollbar py-1" id="kategori-wrapper">
                    <!-- Kategori dimuat otomatis oleh JS -->
                </div>
            </div>

            <!-- 4. FILTER LEVEL -->
            <div>
                <label class="block text-[10px] font-black text-[#725e42] uppercase mb-1.5 px-1">Filter Level</label>
                <div class="overflow-x-auto flex gap-1.5 no-scrollbar py-1" id="level-wrapper">
                    <button type="button" onclick="selectLevel('')" class="btn-level flex-none px-2.5 py-1 text-[9px] font-black rounded-lg border border-[#ded7b8] bg-[#ff9800] text-white uppercase">Semua</button>
                    <button type="button" onclick="selectLevel('1-10')" class="btn-level flex-none px-2.5 py-1 text-[9px] font-black rounded-lg border border-[#ded7b8] bg-white text-[#725e42] uppercase">Lvl 1-10</button>
                    <button type="button" onclick="selectLevel('11-30')" class="btn-level flex-none px-2.5 py-1 text-[9px] font-black rounded-lg border border-[#ded7b8] bg-white text-[#725e42] uppercase">Lvl 11-30</button>
                    <button type="button" onclick="selectLevel('31-50')" class="btn-level flex-none px-2.5 py-1 text-[9px] font-black rounded-lg border border-[#ded7b8] bg-white text-[#725e42] uppercase">Lvl 31-50</button>
                    <button type="button" onclick="selectLevel('51+')" class="btn-level flex-none px-2.5 py-1 text-[9px] font-black rounded-lg border border-[#ded7b8] bg-white text-[#725e42] uppercase">Lvl 51+</button>
                </div>
            </div>

            <!-- 5. BARIS KONTROL: MESIN & RESET -->
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-[#ded7b8]">
                <button type="button" id="btn-machine" class="btn-kategori w-full text-center py-2 px-1 text-[9px] uppercase">
                    <i class="fa-solid fa-gear mr-1"></i> Khusus Machine
                </button>

                <button type="button" id="btn-reset" class="bg-[#e53935] text-white font-black text-[9px] py-2 px-1 rounded-xl uppercase border-b-2 border-[#b71c1c] active:translate-y-0.5 flex items-center justify-center gap-1 shadow-sm">
                    <i class="fa-solid fa-rotate-left"></i> Reset Filter
                </button>
            </div>

            <!-- DAFTAR PRODUK / MESIN (GRID) -->
            <div class="grid grid-cols-2 gap-3 pt-2" id="produk-wrapper">
                <div class="col-span-2 text-center py-10 bg-white rounded-2xl border border-[#ded7b8]">
                    <i class="fa-solid fa-spinner animate-spin text-[#8c785c] text-2xl mb-2 block"></i>
                    <p class="text-xs font-black text-[#725e42] uppercase">Memuat Data...</p>
                </div>
            </div>

            <!-- INFO TOTAL ITEM -->
            <div class="text-center pt-2">
                <span id="total-info" class="text-[#725e42] font-black text-[10px] uppercase bg-[#ece5c8] px-3 py-1 rounded-full border border-[#ded7b8]">
                    0 food · 0 mesin
                </span>
            </div>

        </section>

    </main>

    <!-- JS LANGSUNG TANPA DEPENDENCY FILE MAIN.JS -->
    <script>
        window.currentKategori = "Semua";
        window.currentLevel = "";
        window.isMachineOnly = false;

        document.addEventListener("DOMContentLoaded", function () {
            initApp();

            const searchInput = document.getElementById("search-input");
            if (searchInput) searchInput.addEventListener("input", renderKatalog);

            const btnReset = document.getElementById("btn-reset");
            if (btnReset) {
                btnReset.addEventListener("click", function () {
                    if (searchInput) searchInput.value = "";
                    window.currentKategori = "Semua";
                    window.currentLevel = "";
                    window.isMachineOnly = false;
                    
                    const btnMachine = document.getElementById("btn-machine");
                    if (btnMachine) btnMachine.classList.remove("active-kat");

                    updateLevelUI();
                    renderKatalog();
                });
            }

            const btnMachine = document.getElementById("btn-machine");
            if (btnMachine) {
                btnMachine.addEventListener("click", function () {
                    window.isMachineOnly = !window.isMachineOnly;
                    this.classList.toggle("active-kat");
                    renderKatalog();
                });
            }
        });

        async function initApp() {
            // 1. Coba ambil banner dari localStorage
            const localBanner = localStorage.getItem("hayday_banner");
            if (localBanner) {
                document.getElementById("gambar-toko").src = localBanner;
            }

            // 2. Fetch data produk dari folder backed/food.json
            try {
                const res = await fetch("backed/food.json?v=" + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    const list = Array.isArray(data) ? data : (data.products || []);
                    if (list.length > 0) {
                        localStorage.setItem("hayday_products", JSON.stringify(list));
                    }
                    if (data.banner && !localBanner) {
                        document.getElementById("gambar-toko").src = data.banner;
                    }
                }
            } catch (e) {
                console.log("JSON fetch skipped or offline, using local storage");
            }

            // 3. Render Katalog
            renderKatalog();
        }

        function selectLevel(lvl) {
            window.currentLevel = lvl;
            updateLevelUI();
            renderKatalog();
        }

        function updateLevelUI() {
            const btns = document.querySelectorAll("#level-wrapper .btn-level");
            btns.forEach(btn => {
                btn.classList.remove("bg-[#ff9800]", "text-white");
                btn.classList.add("bg-white", "text-[#725e42]");
            });

            btns.forEach(btn => {
                const btnTxt = btn.innerText.toLowerCase();
                if ((window.currentLevel === "" && btnTxt === "semua") ||
                    (window.currentLevel !== "" && btnTxt.includes(window.currentLevel.toLowerCase()))) {
                    btn.classList.remove("bg-white", "text-[#725e42]");
                    btn.classList.add("bg-[#ff9800]", "text-white");
                }
            });
        }

        function renderKatalog() {
            const produkList = JSON.parse(localStorage.getItem("hayday_products")) || [];
            const wrapper = document.getElementById("produk-wrapper");
            const searchVal = document.getElementById("search-input") ? document.getElementById("search-input").value.toLowerCase() : "";

            renderTombolKategori(produkList);

            let filtered = produkList.filter(item => {
                const matchSearch = item.nama.toLowerCase().includes(searchVal) || 
                                    (item.mesin && item.mesin.toLowerCase().includes(searchVal));
                
                const matchKategori = (window.currentKategori === "Semua") || (item.kategori === window.currentKategori);
                
                let matchLevel = true;
                if (window.currentLevel === "1-10") matchLevel = item.level >= 1 && item.level <= 10;
                else if (window.currentLevel === "11-30") matchLevel = item.level >= 11 && item.level <= 30;
                else if (window.currentLevel === "31-50") matchLevel = item.level >= 31 && item.level <= 50;
                else if (window.currentLevel === "51+") matchLevel = item.level >= 51;

                let matchMachine = true;
                if (window.isMachineOnly) {
                    matchMachine = (item.jenis === "machine") || (item.mesin && item.mesin.toLowerCase().includes("mesin"));
                }

                return matchSearch && matchKategori && matchLevel && matchMachine;
            });

            const totalFood = filtered.filter(i => i.jenis !== "machine").length;
            const totalMesin = filtered.filter(i => i.jenis === "machine").length;
            document.getElementById("total-info").innerText = `${totalFood} food · ${totalMesin} mesin`;

            wrapper.innerHTML = "";
            if (filtered.length === 0) {
                wrapper.innerHTML = `
                    <div class="col-span-2 text-center py-8 bg-white rounded-2xl border border-[#ded7b8]">
                        <p class="text-xs font-black text-[#725e42] uppercase">Data Masih Kosong</p>
                        <p class="text-[10px] text-[#8c785c] mt-1">Silakan tambah produk di <a href="admin.html" class="underline font-bold text-[#ff9800]">Halaman Admin</a></p>
                    </div>`;
                return;
            }

            filtered.forEach(item => {
                const imgFallback = "https://placehold.co/200x200/ded7b8/5c4a38?text=Hay+Day";
                wrapper.innerHTML += `
                    <div class="bg-white rounded-2xl p-2.5 border-2 border-[#ded7b8] shadow-sm flex flex-col justify-between">
                        <div class="relative w-full h-24 rounded-xl overflow-hidden mb-2 bg-[#f9f6ef] border border-[#ded7b8]">
                            <img src="${item.gambar}" onerror="this.onerror=null; this.src='${imgFallback}';" alt="${item.nama}" class="w-full h-full object-cover">
                            <span class="absolute top-1 right-1 bg-[#ff9800] text-white font-black text-[8px] px-1.5 py-0.5 rounded-md uppercase">Lvl ${item.level}</span>
                        </div>
                        <div>
                            <h3 class="font-black text-[#5c4a38] text-xs leading-tight mb-0.5">${item.nama}</h3>
                            <p class="text-[9px] text-[#8c785c] font-bold">${item.kategori} ${item.mesin ? '· ' + item.mesin : ''}</p>
                        </div>
                        <div class="mt-2 pt-1 border-t border-[#f0ead8] flex justify-between items-center">
                            <span class="text-[10px] font-black text-[#4a8d42]">Rp ${(item.harga || 0).toLocaleString('id-ID')}</span>
                        </div>
                    </div>`;
            });
        }

        function renderTombolKategori(produkList) {
            const katWrapper = document.getElementById("kategori-wrapper");
            if (!katWrapper) return;

            const kategoriSet = ["Semua", ...new Set(produkList.map(item => item.kategori).filter(Boolean))];

            katWrapper.innerHTML = kategoriSet.map(kat => `
                <button type="button" 
                    onclick="selectKategori('${kat}')" 
                    class="btn-kategori flex-none uppercase ${window.currentKategori === kat ? 'active-kat' : ''}">
                    ${kat}
                </button>
            `).join("");
        }

        function selectKategori(kat) {
            window.currentKategori = kat;
            renderKatalog();
        }
    </script>
</body>
</html>
