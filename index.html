<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hay Day Food List</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="top-header">
    <div class="header-container">
      <div class="logo-area">
        <div class="badge-hd">HD</div>
        <div class="title-area">
          <h1>Hay Day Food List</h1>
          <p id="total-stats">0 food · 0 mesin</p>
        </div>
      </div>
      <div class="lang-switch">
        <button class="active">ID</button>
        <button>EN</button>
      </div>
    </div>
  </header>

  <!-- Container Katalog Produk -->
  <main class="main-content" id="catalog-container">
    <!-- Di-render dinamis oleh JavaScript berdasarkan Kategori -->
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div class="bottom-bar">
    <div class="bar-info">
      <span>Total Food Dipilih</span>
      <strong id="bar-item-count">0 item</strong>
    </div>
    <button class="btn-checkout" onclick="checkoutWA()">Beli via WA</button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
