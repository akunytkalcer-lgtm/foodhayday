<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Item Food Hay Day</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Hay Day Food Shop</h1>
    <div class="cart-status">
      Keranjang: <span id="cart-count">0</span> item
    </div>
  </header>

  <main>
    <h2>Katalog Makanan Hay Day</h2>
    <div id="product-list" class="grid-container">
      <!-- Item akan dirender otomatis oleh JavaScript -->
    </div>
  </main>

  <section id="checkout-section">
    <h2>Keranjang Belanja</h2>
    <ul id="cart-items"></ul>
    <p>Total: <strong><span id="total-price">0</span> Gold</strong></p>
    <button id="btn-whatsapp" onclick="checkoutWA()">Beli via WhatsApp</button>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
