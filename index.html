<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hay Day Store - Layanan Item & Food</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <h1>🌾 HAY DAY STORE</h1>
      <p>Pusat Jual Beli Food & Item Hay Day Murah & Cepat</p>
    </div>
  </header>

  <!-- Container Utama -->
  <div class="container">

    <!-- Katalog Produk -->
    <h2 class="section-title">🛒 Pilihan Item & Food</h2>
    <div class="product-grid" id="productGrid">
      <!-- Diisi otomatis oleh JS -->
    </div>

    <!-- Ringkasan Order -->
    <div class="cart-card">
      <h3>📋 Detail Pesanan</h3>
      <div id="cartList" class="cart-list">
        <p class="empty-text">Pilih produk di atas untuk menambahkan ke pesanan.</p>
      </div>

      <div class="cart-total">
        <span>Total Estimasi:</span>
        <strong id="totalPrice">Rp 0</strong>
      </div>

      <!-- Form Pemesan -->
      <form id="orderForm" class="order-form">
        <div class="form-group">
          <label>Nama / Nickname Game</label>
          <input type="text" id="buyerName" placeholder="Masukkan nama kamu" required>
        </div>
        <div class="form-group">
          <label>Tag Farm (#Kode Pertanian)</label>
          <input type="text" id="buyerTag" placeholder="Contoh: #P920YYL" required>
        </div>

        <button type="submit" class="btn-wa">
          <span>💬 Order via WhatsApp</span>
        </button>
      </form>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 Food Hay Day | WA: 0878-8830-7856</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
